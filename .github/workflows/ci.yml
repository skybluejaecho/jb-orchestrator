name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

  jarvis:
    name: Jarvis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jarvis
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/jarvis/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run contract tests
        run: npm test

      - name: Build Jarvis
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jb_orchestrator
          POSTGRES_USER: jb_orchestrator
          POSTGRES_PASSWORD: jb_orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jb_orchestrator -d jb_orchestrator"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JB_ENVIRONMENT: test
      JB_DATABASE_URL: postgresql+asyncpg://jb_orchestrator:jb_orchestrator@localhost:5432/jb_orchestrator
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov=jb_orchestrator --cov-report=term-missing
