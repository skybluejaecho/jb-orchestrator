stages:
  - quality
  - test

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy

lint:
  stage: quality
  script:
    - uv sync --extra dev --frozen
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy

test:
  stage: test
  script:
    - uv sync --extra dev --frozen
    - uv run pytest --cov=jb_orchestrator --cov-report=term-missing

