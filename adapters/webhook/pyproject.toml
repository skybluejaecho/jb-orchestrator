[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jb-webhook-notifier"
version = "0.1.0.dev0"
description = "Generic signed JSON webhook notification provider for jb-orchestrator."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "jb-orchestrator>=0.1.0.dev0",
  "pydantic-settings>=2.7,<3",
]

[project.entry-points."jb_orchestrator.notification_providers"]
webhook = "jb_webhook_notifier:create_provider"

[tool.hatch.build.targets.wheel]
packages = ["src/jb_webhook_notifier"]
