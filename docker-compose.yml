services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jb_orchestrator
      POSTGRES_USER: jb_orchestrator
      POSTGRES_PASSWORD: jb_orchestrator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jb_orchestrator -d jb_orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - jb_orchestrator_postgres:/var/lib/postgresql/data

volumes:
  jb_orchestrator_postgres:

