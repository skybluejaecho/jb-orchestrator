[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jb-orchestrator"
version = "0.1.0.dev0"
description = "A local-first orchestration core for agent workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.20,<2",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6,<7",
]

[project.scripts]
jb = "jb_orchestrator.cli.main:main"
jb-api = "jb_orchestrator.api.main:run"
jb-mcp = "jb_orchestrator.mcp_server.main:main"
jb-worker = "jb_orchestrator.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jb_orchestrator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "adapters/openclaw/src", "tools/system-smoke-executor/src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jb_orchestrator", "jb_openclaw_executor"]
mypy_path = "adapters/openclaw/src"
